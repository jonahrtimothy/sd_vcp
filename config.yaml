# S&D + VCP Studio configuration.
# Everything here is a tunable that should NOT be hardcoded in modules
# (SYSTEM_BUILD_PROMPT.md Section 15). Edit this file directly, or (once
# built) via the dashboard's Watchlist Management page.

# REPURPOSED Sep 1 2026 (Step 15.2): this list used to BE the scanned
# universe (a hand-picked 40 names). Since the universe is now sourced
# live from Kite's own F&O instruments master (get_fno_universe(), ~210
# stocks and growing/self-updating), this list is now an EXCLUDE list
# instead -- symbols to skip even though they're F&O-eligible (e.g.
# something illiquid, or one you just don't want cluttering the scan).
# scanner.py operates on get_fno_universe() minus whatever's listed here.
# This was a default picked by Claude Code (per the Step 15 handoff doc's
# own recommendation), not silently assumed -- see PROJECT_CONTEXT.md.
# Cleared to empty on this transition, since keeping the old 40-name
# INCLUDE list here would have flipped to EXCLUDING exactly those stocks.
# Managed via the dashboard's "Excluded Symbols" page, or edit directly:
watchlist: []

detection:
  zone_lookback: 3
  zone_min_move_pct: 5.0
  zone_max_base_bars: 20
  vcp_contraction_ratio_threshold: 0.85
  vcp_volume_multiple_trigger: 1.5
  # stage.py needs at least this many trading days of OHLCV history
  stage_min_bars: 210
  # bootstrap fetch window (CALENDAR days) the very first time a symbol has
  # no OHLCV history at all yet; after that, backfill only pulls what's
  # missing. Needs real margin above stage_min_bars (210 TRADING days) --
  # weekends/holidays mean ~300 calendar days only yields ~203 trading
  # days in practice (confirmed against real Kite data), so this is set
  # well above the naive 210-calendar-day guess.
  ohlcv_bootstrap_days: 400

# Section 7 real confluence data layer thresholds. First-pass engineering
# judgment calls (same magnitudes previously hardcoded in confluence.py) --
# calibrate against real results once more daily history accumulates.
confluence:
  fii_dii_net_threshold_cr: 1000.0
  oi_buildup_lookback_days: 5
  delivery_lookback_days: 5
  delivery_trend_threshold_pp: 3.0
  data_staleness_days: 3
  bonus_fii_dii: 8.0
  bonus_oi_buildup: 6.0
  bonus_delivery_trend: 5.0
  # Nifty trend alignment: does the setup direction agree with NIFTY 50's
  # own Stage classification (same stage.py engine, run on the index)?
  bonus_nifty_alignment: 6.0
  # Sector relative strength: does the stock's own sector index outperform/
  # underperform NIFTY 50 over this trailing window, in the direction that
  # supports the setup? Toggled on/off via fundamentals.sector_strength_enabled
  # below (checkbox on the dashboard) since it's a softer, more debatable
  # signal than the earnings-growth filter.
  sector_rs_lookback_days: 20
  sector_rs_threshold_pp: 2.0
  bonus_sector_rs: 6.0

fundamentals:
  # screener.in data doesn't change day to day -- cache and only re-scrape
  # this often, per symbol, rather than hitting screener.in every daily run
  cache_max_age_days: 7
  # minimum quarters of Sales/Net Profit/EPS history needed to judge a
  # growth trend at all; below this the filter reports "insufficient_data"
  # rather than guessing
  min_quarters_required: 6
  # on/off switch for the sector-relative-strength confluence input --
  # exposed as a checkbox on the dashboard (Excluded Symbols page)
  sector_strength_enabled: true
  # Step 15.4 (Sep 1 2026): earnings-quality red flag -- Inventory/Trade
  # Receivables (reconstructed from screener.in's annual Debtor Days /
  # Inventory Days ratios, since the raw balance-sheet line items aren't
  # reliably exposed in static HTML -- see screener_scraper.py's
  # _compute_earnings_quality_flag docstring) growing this many times
  # faster than Sales YoY trips the flag. Flag/warning severity only, per
  # Jonah's explicit call -- never excludes a symbol from the scan.
  earnings_quality_multiplier: 2.5

# Relative Strength (RS) Rating -- Step 15.3 (Aug 31 2026 addition,
# Section 7/2 item 8). Approximates IBD's RS Rating: a weighted blend of
# trailing quarterly returns, percentile-ranked against the whole scanned
# universe. NOT the real published IBD metric -- see src/rs_rating.py's
# docstring for the full limitation note.
rs_rating:
  # weights for [most recent quarter, 2nd, 3rd, 4th], most-recent-first.
  # Must sum to 1.0. The commonly-cited public approximation of IBD's
  # methodology: heaviest weight on the most recent ~63 trading days.
  quarter_weights: [0.4, 0.2, 0.2, 0.2]

# VCP base staging -- Step 15.4/15.5 (Sep 1 2026 addition, Section 4/7).
# Counts how many distinct qualifying VCP bases a symbol has printed since
# its most recent Stage 1->2 transition (Minervini's "which base are we
# on" confidence discount -- a 4th-stage base breaking out is statistically
# much less reliable than a 1st or 2nd). Bullish/Stage 2 only -- this is a
# Stage-2-uptrend concept in the original methodology, not defined for
# Stage 4 declines (see vcp.py's count_bases_since_stage2() docstring).
base_staging:
  # how often (in trading days) to re-run classify_stage() while walking
  # back through history to find the last Stage 1->2 transition. Base
  # durations are measured in weeks, so day-level precision isn't needed --
  # this trades a small amount of transition-date precision for a real
  # (~5x) reduction in the classify_stage() calls a full-universe scan
  # has to make.
  stage_sample_stride_days: 5
  # confidence multiplier applied alongside the existing Stage alignment
  # multiplier in confluence.py -- 1st base full weight, 2nd a slight
  # discount, 3rd+ a meaningful discount, per the Step 15 handoff's own
  # wording.
  base_multiplier_1st: 1.0
  base_multiplier_2nd: 0.85
  base_multiplier_3plus: 0.6

data:
  broker: kite_connect
  db_path: data/studio.db
